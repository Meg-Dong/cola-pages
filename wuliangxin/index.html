<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <title>四无量心 · 五蕴无常</title>
  <style>
    :root {
      --paper: #f4efe6;
      --paper-deep: #e9dfd0;
      --ink: #30352f;
      --muted: #7b8177;
      --line: rgba(71, 77, 67, .17);
      --green: #607a62;
      --green-deep: #3e5e49;
      --gold: #b7894b;
      --rose: #a96867;
      --blue: #638094;
      --plum: #756477;
      --white: rgba(255,255,255,.68);
      --shadow: 0 14px 40px rgba(69, 65, 52, .10);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.7), transparent 27rem),
        linear-gradient(145deg, var(--paper), #eee5d7 55%, #e4d8c8);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(100%, 960px); margin: 0 auto; padding: 28px 20px 56px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap: 16px; margin-bottom: 34px; }
    .brand { display:flex; align-items:center; gap: 11px; }
    .brand-mark { width: 38px; height: 38px; display:grid; place-items:center; border-radius: 50%; background: #d4c8b2; color: var(--green-deep); font-size: 20px; }
    .eyebrow { margin: 0; color: var(--green-deep); font-size: 12px; letter-spacing: .12em; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 2px; font-family: "Songti SC", "STSong", serif; font-size: clamp(25px, 5vw, 38px); font-weight: 500; letter-spacing: 0; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .tool-btn { border: 1px solid var(--line); color: var(--green-deep); background: rgba(255,255,255,.38); padding: 8px 12px; border-radius: 6px; }
    .tool-btn:hover { background: var(--white); }

    .hero { display:grid; grid-template-columns: 1.1fr .9fr; gap: 32px; align-items:center; margin-bottom: 34px; }
    .hero-copy h2 { max-width: 500px; margin-bottom: 12px; font-family: "Songti SC", "STSong", serif; font-size: clamp(24px, 5vw, 42px); font-weight: 500; line-height: 1.2; }
    .hero-copy p { max-width: 520px; color: var(--muted); font-size: 15px; }
    .progress-wrap { display:flex; justify-content:center; }
    .progress-ring { --progress: 0%; position:relative; width: 190px; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; background: conic-gradient(var(--green) var(--progress), rgba(96,122,98,.14) 0); box-shadow: var(--shadow); }
    .progress-ring::before { content:""; position:absolute; inset: 11px; border-radius:50%; background: rgba(246,241,232,.94); }
    .progress-label { position:relative; text-align:center; }
    .progress-label strong { display:block; font-family:"Songti SC", "STSong", serif; font-size:42px; font-weight:500; line-height:1; }
    .progress-label span { color:var(--muted); font-size:13px; }
    .primary { border:0; border-radius: 6px; padding: 13px 20px; background: var(--green-deep); color:#fff; box-shadow: 0 8px 20px rgba(62,94,73,.18); }
    .primary:hover { background:#304c3a; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }

    .section { margin-top: 34px; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    .section-head h2 { margin:0; font-family:"Songti SC", "STSong", serif; font-size:22px; font-weight:500; }
    .section-head span { color:var(--muted); font-size:12px; }
    .seeds { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top:16px; }
    .seed { min-height: 186px; padding:16px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.42); position:relative; overflow:hidden; }
    .seed::after { content:""; position:absolute; width:100px; height:100px; right:-42px; bottom:-48px; border-radius:50%; background:var(--seed-soft); opacity:.38; }
    .seed-head { display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1; }
    .seed-name { font-family:"Songti SC", "STSong", serif; font-size:20px; }
    .seed-count { color:var(--muted); font-size:12px; }
    .seed-visual { position:relative; z-index:1; height:78px; display:flex; align-items:center; justify-content:center; font-size:52px; line-height:1; filter:saturate(.84); }
    .seed-stage { position:relative; z-index:1; color:var(--muted); font-size:12px; }
    .seed-bar { position:relative; z-index:1; height:4px; margin-top:9px; border-radius:4px; background:rgba(71,77,67,.12); overflow:hidden; }
    .seed-bar i { display:block; height:100%; width:0; background:var(--seed); border-radius:inherit; transition:width .5s ease; }
    .seed-note { position:relative; z-index:1; margin:8px 0 0; color:var(--muted); font-size:11px; }
    .seed-actions { position:relative; z-index:2; display:flex; gap:6px; margin-top:11px; }
    .seed-action, .audio-file-btn { border:1px solid var(--line); border-radius:5px; padding:6px 8px; color:var(--green-deep); background:rgba(255,255,255,.58); font-size:11px; }
    .seed-action:hover, .audio-file-btn:hover { background:#fff; }
    .audio-file-btn input { display:none; }

    .session { display:none; margin-top: 26px; padding:20px; border-top: 2px solid var(--green); background:rgba(255,255,255,.42); }
    .session.is-open { display:block; animation:rise .3s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .session-top { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; }
    .session h2 { margin-bottom:4px; font-family:"Songti SC", "STSong", serif; font-size:24px; font-weight:500; }
    .timer { color:var(--green-deep); font-variant-numeric:tabular-nums; font-size:24px; }
    .choice-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:18px 0; }
    .choice { border:1px solid var(--line); border-radius:6px; background:rgba(255,255,255,.48); padding:11px 8px; color:var(--ink); }
    .choice.selected { border-color:var(--seed); box-shadow: inset 0 -3px 0 var(--seed); background:var(--seed-soft); }
    .choice strong { display:block; font-family:"Songti SC", "STSong", serif; font-size:18px; font-weight:500; }
    .choice small { color:var(--muted); font-size:11px; }
    .audio-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin: 12px 0 16px; color:var(--muted); font-size:12px; }
    .audio-row input { max-width:100%; font-size:12px; }
    .audio-row .audio-file-btn { margin-left:auto; }
    audio { width:min(100%, 360px); height:32px; }
    .audio-status { width:100%; color:var(--green-deep); font-size:12px; }
    .audio-remove { border:0; padding:0; background:transparent; color:var(--muted); font-size:11px; }
    .audio-remove:hover { color:var(--rose); }
    .session-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .secondary { border:1px solid var(--line); border-radius:6px; padding:10px 15px; color:var(--green-deep); background:rgba(255,255,255,.48); }
    .secondary:hover { background:#fff; }

    .reflection { display:none; margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
    .reflection.is-open { display:block; }
    .field { margin-top:14px; }
    .field label { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; }
    .field input[type="date"], .field input[type="number"], .field textarea { width:100%; border:1px solid var(--line); border-radius:5px; background:rgba(255,255,255,.64); color:var(--ink); padding:10px 11px; outline:none; }
    .field textarea { min-height:84px; resize:vertical; }
    .field input:focus, .field textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(96,122,98,.12); }
    .aggregate-grid { display:flex; flex-wrap:wrap; gap:7px; }
    .aggregate { border:1px solid var(--line); border-radius:999px; padding:7px 11px; background:rgba(255,255,255,.48); color:var(--ink); font-size:12px; }
    .aggregate.selected { border-color:var(--plum); background:rgba(117,100,119,.12); color:var(--plum); }
    .form-row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .message { min-height:22px; margin:12px 0 0; color:var(--green-deep); font-size:13px; }

    .history-list { display:grid; gap:10px; margin-top:16px; }
    .empty { padding:28px 0; color:var(--muted); text-align:center; font-size:14px; }
    .record { display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:start; padding:13px 0; border-bottom:1px solid var(--line); }
    .record-dot { width:12px; height:12px; margin-top:7px; border-radius:50%; background:var(--record-color); box-shadow:0 0 0 5px var(--record-soft); }
    .record-title { margin:0; font-family:"Songti SC", "STSong", serif; font-size:17px; }
    .record-meta { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .record-note { margin:7px 0 0; font-size:13px; white-space:pre-wrap; }
    .delete { border:0; background:transparent; color:var(--muted); font-size:12px; padding:4px; }
    .delete:hover { color:var(--rose); }
    .footer-tools { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
    .hint { color:var(--muted); font-size:12px; }
    .watered { animation:watered .7s ease; }
    @keyframes watered { 0% { transform:scale(1); } 45% { transform:scale(1.08) rotate(-2deg); } 100% { transform:scale(1); } }
    @media (max-width: 700px) {
      .page { padding:20px 15px 44px; }
      .topbar { align-items:flex-start; }
      .hero { grid-template-columns:1fr; gap:18px; }
      .hero-copy { text-align:center; }
      .hero-copy p { margin-left:auto; margin-right:auto; }
      .hero-actions { justify-content:center; }
      .progress-ring { width:150px; }
      .progress-label strong { font-size:34px; }
      .seeds { grid-template-columns:repeat(2,1fr); }
      .seed { min-height:178px; }
    }
    @media (max-width: 430px) {
      .topbar { flex-direction:column; }
      .tool-btn { align-self:flex-end; }
      .choice-grid { grid-template-columns:repeat(2,1fr); }
      .form-row { grid-template-columns:1fr; gap:0; }
      .record { grid-template-columns:auto 1fr; }
      .record .delete { grid-column:2; justify-self:start; padding-left:0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">四无量心 · 五蕴无常</p>
          <h1>今日，给心浇水</h1>
          <p class="subtitle">坐下来，看见这一刻。</p>
        </div>
      </div>
      <button class="tool-btn" id="exportBtn" type="button" title="导出本地备份">↗ 导出记录</button>
    </header>

    <section class="hero" aria-labelledby="progressTitle">
      <div class="hero-copy">
        <h2 id="progressTitle">一百次，不是完成任务，是一次次回来。</h2>
        <p>每次坐下，给一颗心浇一点水。练习结束后，留下一句真实的觉察。</p>
        <div class="hero-actions">
          <button class="primary" id="startBtn" type="button">◷ 开始一次练习</button>
          <button class="secondary" id="todayBtn" type="button">查看今日记录</button>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-ring" id="progressRing" aria-label="总练习进度">
          <div class="progress-label"><strong id="totalCount">0</strong><span>总练习 / 100 次</span></div>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="gardenTitle">
      <div class="section-head"><h2 id="gardenTitle">四颗心的园子</h2><span id="gardenSummary">总练习100次 · 四心分别计数</span></div>
      <div class="seeds" id="seeds"></div>
    </section>

    <section class="session" id="session" aria-labelledby="sessionTitle">
      <div class="session-top">
        <div><h2 id="sessionTitle">坐下</h2><p class="hint">选一颗今天想照看的心。</p></div>
        <div class="timer" id="timer">随音频</div>
      </div>
      <div class="choice-grid" id="heartChoices"></div>
      <div class="audio-row">
        <span class="audio-status" id="audioStatus">慈心：还没有绑定音频</span>
        <audio id="audioPlayer" controls hidden></audio>
        <label class="audio-file-btn"><span>绑定本心音频</span><input id="audioFile" type="file" accept="audio/*"></label>
        <button class="audio-remove" id="removeAudioBtn" type="button" hidden>移除本心音频</button>
      </div>
      <div class="session-actions">
        <button class="primary" id="finishBtn" type="button">完成观想，留下记录</button>
        <button class="secondary" id="cancelBtn" type="button">收起</button>
      </div>
      <div class="reflection" id="reflection">
        <div class="form-row">
          <div class="field"><label for="practiceDate">日期</label><input id="practiceDate" type="date"></div>
          <div class="field"><label>本次练习</label><div class="hint" id="durationHint">跟着当前音频走，保存时自动记录时长。</div></div>
        </div>
        <div class="field"><label>这次比较明显的五蕴观察（可选 1-2 个）</label><div class="aggregate-grid" id="aggregateChoices"></div></div>
        <div class="field"><label for="note">下座后，留一句真实的觉察</label><textarea id="note" placeholder="例如：起初很散，后来听见风声，身体慢慢松下来。"></textarea></div>
        <div class="session-actions"><button class="primary" id="saveBtn" type="button">滴水，保存这一次</button><button class="secondary" id="backBtn" type="button">返回修改</button></div>
        <p class="message" id="message" aria-live="polite"></p>
      </div>
    </section>

    <section class="section" id="historySection" aria-labelledby="historyTitle">
      <div class="section-head"><h2 id="historyTitle">练习留下的脚印</h2><span id="recordSummary">0 次记录</span></div>
      <div class="history-list" id="historyList"></div>
      <div class="footer-tools"><button class="tool-btn" id="downloadBtn" type="button">⇩ 下载 JSON 备份</button><span class="hint">记录只保存在这台设备的浏览器里。</span></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'wuliangxin-practice-v1';
    const hearts = {
      ci: { name: '慈心', short: '愿得乐', color: '#a96867', soft: 'rgba(169,104,103,.14)', icon: '🌱' },
      bei: { name: '悲心', short: '愿离苦', color: '#638094', soft: 'rgba(99,128,148,.14)', icon: '🌿' },
      xi: { name: '喜心', short: '愿随喜', color: '#b7894b', soft: 'rgba(183,137,75,.14)', icon: '🌼' },
      she: { name: '舍心', short: '愿平等安稳', color: '#756477', soft: 'rgba(117,100,119,.14)', icon: '🌙' }
    };
    const aggregates = [
      ['色', '身体、呼吸、冷热、紧松'],
      ['受', '舒服、不舒服、平淡'],
      ['想', '画面、标签、联想'],
      ['行', '冲动、抗拒、期待'],
      ['识', '知道、分别、清楚或模糊']
    ];
    let records = loadRecords();
    let selectedHeart = 'ci';
    let selectedAggregates = [];
    let sessionFinished = false;
    const audioMeta = {};
    const audioUrls = {};
    const AUDIO_DB_NAME = 'wuliangxin-audio-v1';
    const AUDIO_STORE = 'heart-audio';
    const DEFAULT_AUDIO = {
      ci: { name: '慈心观修法（清晰降气流版）', url: 'audio/慈心观修法-清晰降气流版.m4a', default: true }
    };

    const $ = (id) => document.getElementById(id);
    const today = () => new Date().toISOString().slice(0, 10);
    const heartCount = (key) => records.filter(r => r.heart === key).length;
    function loadRecords() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function saveRecords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
    function openAudioDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(AUDIO_DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(AUDIO_STORE, { keyPath: 'key' });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    async function getHeartAudio(key) {
      const db = await openAudioDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction(AUDIO_STORE, 'readonly').objectStore(AUDIO_STORE).get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }
    async function saveHeartAudio(key, file) {
      const db = await openAudioDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(AUDIO_STORE, 'readwrite');
        tx.objectStore(AUDIO_STORE).put({ key, name: file.name, type: file.type, blob: file, updatedAt: new Date().toISOString() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }
    async function removeHeartAudio(key) {
      const db = await openAudioDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(AUDIO_STORE, 'readwrite');
        tx.objectStore(AUDIO_STORE).delete(key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }
    async function loadAudioState() {
      for (const key of Object.keys(hearts)) {
        const data = await getHeartAudio(key);
        if (data) {
          audioMeta[key] = data;
          if (audioUrls[key]) URL.revokeObjectURL(audioUrls[key]);
          audioUrls[key] = URL.createObjectURL(data.blob);
        } else if (DEFAULT_AUDIO[key]) {
          audioMeta[key] = DEFAULT_AUDIO[key];
          audioUrls[key] = DEFAULT_AUDIO[key].url;
        } else {
          delete audioMeta[key];
          delete audioUrls[key];
        }
      }
      render();
      updateSessionAudio();
    }
    function stage(count) {
      if (count === 0) return ['种子', '🌰', 0];
      if (count < 7) return ['破土', '🌱', count / 7 * 100];
      if (count < 21) return ['幼苗', '🌿', count / 21 * 100];
      if (count < 49) return ['小树', '🌳', count / 49 * 100];
      if (count < 100) return ['花苞', '🌸', count / 100 * 100];
      return ['结果', '🍎', 100];
    }
    function formatDate(date) {
      const d = new Date(date + 'T00:00:00');
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }
    function formatDuration(minutes) {
      if (!minutes) return '时长未记录';
      return `${minutes} 分钟`;
    }
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
    }
    function render() {
      const total = records.length;
      const pct = Math.min(total / 100 * 100, 100);
      $('totalCount').textContent = total;
      $('progressRing').style.setProperty('--progress', `${pct}%`);
      $('gardenSummary').textContent = total ? `已经浇过 ${total} 次水 · 四心分别计数` : '总练习100次 · 四心分别计数';
      $('recordSummary').textContent = `${total} 次记录`;
      $('seeds').innerHTML = Object.entries(hearts).map(([key, heart]) => {
        const count = heartCount(key);
        const [label, icon, width] = stage(count);
        return `<article class="seed" style="--seed:${heart.color};--seed-soft:${heart.soft}">
          <div class="seed-head"><div class="seed-name">${heart.name}</div><div class="seed-count">${count} 次</div></div>
          <div class="seed-visual" aria-hidden="true">${icon}</div>
          <div class="seed-stage">${label} · ${heart.short}</div>
          <div class="seed-bar"><i style="width:${width}%"></i></div>
          <p class="seed-note">${count ? '这一颗心正在慢慢长大' : '等你今天来看看它'}</p>
          <div class="seed-actions">
            <button class="seed-action" data-seed-practice="${key}" type="button">进入${heart.name}</button>
            <label class="audio-file-btn"><span>${audioMeta[key] ? '更换音频' : '添加音频'}</span><input data-audio-upload="${key}" type="file" accept="audio/*"></label>
          </div>
        </article>`;
      }).join('');
      renderHistory();
    }
    function renderChoices() {
      $('heartChoices').innerHTML = Object.entries(hearts).map(([key, heart]) => `<button class="choice ${key === selectedHeart ? 'selected' : ''}" data-heart="${key}" style="--seed:${heart.color};--seed-soft:${heart.soft}" type="button"><strong>${heart.name}</strong><small>${heart.short}</small></button>`).join('');
      $('aggregateChoices').innerHTML = aggregates.map(([key, desc]) => `<button class="aggregate ${selectedAggregates.includes(key) ? 'selected' : ''}" data-aggregate="${key}" type="button">${key} · ${desc}</button>`).join('');
    }
    function renderHistory() {
      const list = [...records].sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      if (!list.length) { $('historyList').innerHTML = '<div class="empty">还没有脚印。第一次坐下后，它会出现在这里。</div>'; return; }
      $('historyList').innerHTML = list.slice(0, 30).map(record => {
        const h = hearts[record.heart] || hearts.ci;
        const observations = (record.aggregates || []).join('、');
        return `<article class="record" style="--record-color:${h.color};--record-soft:${h.soft}">
          <i class="record-dot" aria-hidden="true"></i>
          <div><p class="record-title">${h.name} · ${formatDate(record.date)}</p><p class="record-meta">${formatDuration(record.duration)}${observations ? ` · 看见：${escapeHtml(observations)}` : ''}</p>${record.note ? `<p class="record-note">${escapeHtml(record.note)}</p>` : ''}</div>
          <button class="delete" data-delete="${record.id}" type="button">删除</button>
        </article>`;
      }).join('');
    }
    function updateSessionAudio() {
      const heart = hearts[selectedHeart];
      const data = audioMeta[selectedHeart];
      $('audioStatus').textContent = data ? `${heart.name}：${data.name}` : `${heart.name}：还没有绑定音频`;
      $('audioPlayer').hidden = !data;
      $('removeAudioBtn').hidden = !data || data.default;
      if (data) {
        $('audioPlayer').src = audioUrls[selectedHeart];
      } else {
        $('audioPlayer').removeAttribute('src');
        $('audioPlayer').load();
      }
    }
    function openSession(heartKey = selectedHeart) {
      selectedHeart = heartKey;
      $('session').classList.add('is-open');
      $('practiceDate').value = today();
      $('reflection').classList.remove('is-open');
      $('message').textContent = '';
      sessionFinished = false;
      selectedAggregates = [];
      renderChoices();
      updateSessionAudio();
      $('session').scrollIntoView({ behavior:'smooth', block:'center' });
    }
    function selectedAudioDuration() {
      const duration = $('audioPlayer').duration;
      return Number.isFinite(duration) && duration > 0 ? Math.max(1, Math.round(duration / 60)) : 0;
    }
    function finishSession() {
      sessionFinished = true;
      $('durationHint').textContent = selectedAudioDuration() ? `当前音频约 ${selectedAudioDuration()} 分钟，保存时自动记录。` : '当前还没有音频，时长将不记录。';
      $('reflection').classList.add('is-open');
      $('reflection').scrollIntoView({ behavior:'smooth', block:'center' });
    }
    function resetSession() {
      sessionFinished = false;
      $('durationHint').textContent = '跟着当前音频走，保存时自动记录时长。';
      $('session').classList.remove('is-open');
    }
    function saveCurrent() {
      if (!$('practiceDate').value) { $('message').textContent = '请先选一个日期。'; return; }
      const record = { id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, date: $('practiceDate').value, heart: selectedHeart, duration: selectedAudioDuration(), aggregates: [...selectedAggregates], note: $('note').value.trim(), createdAt: new Date().toISOString() };
      records.push(record); saveRecords(); render();
      const seed = [...document.querySelectorAll('.seed')].find(node => node.querySelector('.seed-name')?.textContent === hearts[selectedHeart].name);
      if (seed) { seed.classList.add('watered'); setTimeout(() => seed.classList.remove('watered'), 800); }
      $('message').textContent = '这一次已经留下来了。';
      setTimeout(resetSession, 650);
    }
    function download(filename, content, type) {
      const blob = new Blob([content], {type}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
    }

    $('startBtn').addEventListener('click', openSession);
    $('todayBtn').addEventListener('click', () => $('historySection').scrollIntoView({behavior:'smooth'}));
    $('cancelBtn').addEventListener('click', resetSession);
    $('finishBtn').addEventListener('click', finishSession);
    $('backBtn').addEventListener('click', () => { $('reflection').classList.remove('is-open'); sessionFinished = false; });
    $('saveBtn').addEventListener('click', saveCurrent);
    $('heartChoices').addEventListener('click', event => { const button = event.target.closest('[data-heart]'); if (!button) return; selectedHeart = button.dataset.heart; renderChoices(); updateSessionAudio(); });
    $('seeds').addEventListener('click', event => { const button = event.target.closest('[data-seed-practice]'); if (!button) return; openSession(button.dataset.seedPractice); });
    $('seeds').addEventListener('change', async event => { const input = event.target.closest('[data-audio-upload]'); if (!input || !input.files?.[0]) return; await saveHeartAudio(input.dataset.audioUpload, input.files[0]); await loadAudioState(); });
    $('aggregateChoices').addEventListener('click', event => { const button = event.target.closest('[data-aggregate]'); if (!button) return; const key = button.dataset.aggregate; selectedAggregates = selectedAggregates.includes(key) ? selectedAggregates.filter(x => x !== key) : (selectedAggregates.length < 2 ? [...selectedAggregates, key] : selectedAggregates); renderChoices(); });
    $('historyList').addEventListener('click', event => { const button = event.target.closest('[data-delete]'); if (!button) return; records = records.filter(r => r.id !== button.dataset.delete); saveRecords(); render(); });
    $('exportBtn').addEventListener('click', () => download(`四无量心练习备份-${today()}.json`, JSON.stringify(records, null, 2), 'application/json'));
    $('downloadBtn').addEventListener('click', () => download(`四无量心练习备份-${today()}.json`, JSON.stringify(records, null, 2), 'application/json'));
    $('audioFile').addEventListener('change', async event => { const file = event.target.files?.[0]; if (!file) return; await saveHeartAudio(selectedHeart, file); event.target.value = ''; await loadAudioState(); });
    $('removeAudioBtn').addEventListener('click', async () => { await removeHeartAudio(selectedHeart); await loadAudioState(); });

    renderChoices(); render();
    loadAudioState().catch(() => { $('audioStatus').textContent = '本机浏览器暂不支持音频保存'; });
  </script>
</body>
</html>
